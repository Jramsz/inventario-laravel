appName: "inventario"

image:
  repository: "inventario-laravel"
  tag: "1.0"

replicaCount: 1

env:
  APP_NAME: "Inventario Alpha"
  APP_ENV: "production"
  APP_DEBUG: "false"
  LOG_CHANNEL: "stderr"
  DB_CONNECTION: "mysql"
  SESSION_DRIVER: "database"
  CACHE_STORE: "database"
  SESSION_COOKIE: "laravel_session"

subdomain: "inventario"

containerPort: 80

database: true

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 6
  targetCPU: 70
  porTrafico: true
